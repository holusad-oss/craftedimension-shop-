<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Craftedimension</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Grenze+Gotisch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<style>table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:.45rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td input{padding:.4rem .5rem}.wrap{overflow-x:auto}select{padding:.45rem .6rem;border:var(--hair);border-radius:2px;background:transparent;font:inherit}.status{display:inline-block;padding:.1rem .5rem;border-radius:2px;font-size:.8rem;font-weight:700;text-transform:uppercase;background:#eee;color:var(--ink)}.status-paid{background:#f4d9a8;color:#6b3d00}.status-sent{background:#cfe6d4;color:#1f5130}.status-pending,.status-cancelled,.status-expired,.status-failed{color:#5c4033}</style></head>
<body><header class="site-header"><a class="logo" href="/"><img src="/img/logo-full-dark.svg" alt="Craftedimension" height="30"></a><nav><a href="/">View shop</a></nav></header>
<main><h1>Shop admin</h1><p class="demo-note">Paid orders come from Stripe. Mark an order as sent once it's posted.</p>
<h2>Products</h2><div class="wrap"><table><thead><tr><th>Name</th><th>Description</th><th>Price £</th><th>Stock</th><th>Type</th><th>Sample</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Add product</h2><form id="add" class="contact-form"><label>Name<input name="name" required></label><label>Description<input name="description"></label><label>Price (£)<input name="price" type="number" step="0.01" min="0" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Print type<select name="printType"><option>FDM</option><option>Resin</option></select></label><button class="btn">Add product</button></form>
<h2>Orders</h2><label style="display:inline-flex;align-items:center;margin-bottom:.5rem"><input type="checkbox" id="showall" style="width:auto;margin-right:.4rem" onchange="load()"> Show unpaid/cancelled too</label><div class="wrap"><table><thead><tr><th>Order</th><th>When</th><th>Status</th><th>Customer</th><th>Ship to</th><th>Items</th><th>Total</th><th></th></tr></thead><tbody id="orders"></tbody></table></div></main>
<script>
const gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});return r.json();}
async function load(){const d=await api('/api/admin/data');
rows.innerHTML=d.products.map(p=>`<tr data-id="${p.id}"><td><input name="name" value="${esc(p.name)}"></td><td><input name="description" value="${esc(p.description)}"></td><td><input name="price" type="number" step="0.01" value="${p.price}" style="width:6rem"></td><td><input name="stock" type="number" min="0" value="${p.stock}" style="width:5rem"></td><td><select name="printType"><option ${p.printType!=='Resin'?'selected':''}>FDM</option><option ${p.printType==='Resin'?'selected':''}>Resin</option></select></td><td><input name="sample" type="checkbox" ${p.sample?'checked':''} style="width:auto"></td><td><button class="btn small" data-save>Save</button> <button class="btn small" data-del style="background:#a3331f">Delete</button></td></tr>`).join('');
const addr=o=>{const s=o.shipping;if(!s)return '—';const a=s.address||{};return [s.name,a.line1,a.line2,a.city,a.state,a.postal_code,a.country].filter(Boolean).map(esc).join('<br>');};
const badge=o=>{const s=o.status||'demo';return `<span class="status status-${esc(s)}">${esc(s)}</span>`+(o.sentAt?`<br><small>${new Date(o.sentAt).toLocaleDateString('en-GB')}</small>`:'')+(o.note?`<br><small>${esc(o.note)}</small>`:'');};
const show=document.getElementById('showall');const list=d.orders.slice().reverse().filter(o=>show.checked||['paid','sent','awaiting_payment'].includes(o.status));
orders.innerHTML=list.map(o=>`<tr data-order="${esc(o.id)}"><td>${esc(o.id)}</td><td>${new Date(o.paidAt||o.createdAt).toLocaleString('en-GB')}</td><td>${badge(o)}</td><td>${esc(o.name||'')}<br>${esc(o.email||'')}</td><td>${addr(o)}</td><td>${o.items.map(i=>esc(i.qty+'× '+i.name)).join('<br>')}</td><td>${gbp.format(o.amountPaid!=null?o.amountPaid:o.total)}${o.postage!=null?`<br><small>${o.postage?'incl. '+gbp.format(o.postage)+' postage':'free postage'}</small>`:''}</td><td>${o.status==='paid'?'<button class="btn small" data-sent>Mark sent</button>':o.status==='sent'?'<button class="btn small btn-ghost" data-unsent>Undo</button>':''}</td></tr>`).join('')||'<tr><td colspan=8>No paid orders yet.</td></tr>';}
document.addEventListener('click',async e=>{const ot=e.target.closest('tr[data-order]');if(ot&&(e.target.hasAttribute('data-sent')||e.target.hasAttribute('data-unsent'))){await api('/api/admin/orders/'+ot.dataset.order+'/sent','POST',{sent:e.target.hasAttribute('data-sent')});return load();}const tr=e.target.closest('tr[data-id]');if(!tr)return;const id=tr.dataset.id;
if(e.target.hasAttribute('data-save')){const b={};tr.querySelectorAll('input,select').forEach(i=>b[i.name]=i.type==='checkbox'?i.checked:i.value);await api('/api/admin/products/'+id,'PUT',b);load();}
if(e.target.hasAttribute('data-del')&&confirm('Delete this product?')){await api('/api/admin/products/'+id,'DELETE');load();}});
add.addEventListener('submit',async e=>{e.preventDefault();await api('/api/admin/products','POST',Object.fromEntries(new FormData(add)));add.reset();load();});load();
</script></body></html>
